name: Generate package candidate from comment

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: package-candidate-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/generate-candidate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      accepted: ${{ steps.request.outputs.accepted }}
      candidate_version: ${{ steps.request.outputs.candidate_version }}
      error: ${{ steps.request.outputs.error }}
      pull_request_number: ${{ steps.request.outputs.pull_request_number }}
      reportable: ${{ steps.request.outputs.reportable }}
      source_sha: ${{ steps.request.outputs.source_sha }}
    steps:
      - id: request
        name: Resolve trusted candidate request
        shell: bash
        env:
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          accepted=false
          candidate_version=''
          error='Candidate generation requires an authorized actor on an open same-repository release/* or hotfix/* pull request targeting master.'
          reportable=false
          source_sha=''
          pull_request="$(gh api "repos/$REPOSITORY/pulls/$PULL_REQUEST_NUMBER")"
          head_branch="$(jq --raw-output '.head.ref // empty' <<<"$pull_request")"
          head_repository="$(jq --raw-output '.head.repo.full_name // empty' <<<"$pull_request")"
          resolved_source_sha="$(jq --raw-output '.head.sha // empty' <<<"$pull_request")"

          if [[ "$COMMENT_ASSOCIATION" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]] &&
             jq --exit-status \
               --arg repository "$REPOSITORY" \
               '.state == "open" and
                .merged_at == null and
                .base.ref == "master" and
                (.head.ref | startswith("release/") or startswith("hotfix/")) and
                .head.repo.full_name == $repository and
                (.head.sha | test("^[0-9a-f]{40}$"))' <<<"$pull_request" >/dev/null; then
            reportable=true
            source_sha="$resolved_source_sha"
            if [[ "$head_branch" == release/* ]]; then
              base_version="${head_branch#release/}"
              channel=rc
            else
              base_version="${head_branch#hotfix/}"
              channel=hotfix
            fi

            if [[ "$base_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              accepted=true
              candidate_version="${base_version}-${channel}.${PULL_REQUEST_NUMBER}.${source_sha:0:12}"
              error=''
            else
              error='Candidate branches must use release/<stable-semver> or hotfix/<stable-semver>.'
            fi
          fi

          {
            echo "accepted=$accepted"
            echo "candidate_version=$candidate_version"
            echo "error=$error"
            echo "pull_request_number=$PULL_REQUEST_NUMBER"
            echo "reportable=$reportable"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

  check:
    needs: resolve
    if: needs.resolve.outputs.reportable == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        name: Create package candidate check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          check="$(gh api --method POST "repos/$REPOSITORY/check-runs" \
            --raw-field name='Package candidate' \
            --raw-field head_sha="$SOURCE_SHA" \
            --raw-field status=in_progress \
            --raw-field details_url="$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          echo "id=$(jq --raw-output .id <<<"$check")" >> "$GITHUB_OUTPUT"

  package-gate:
    needs: resolve
    if: needs.resolve.outputs.accepted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
      pull-requests: read
    outputs:
      blockers: ${{ steps.checks.outputs.blockers }}
      error: ${{ steps.identity.outputs.error || steps.checks.outputs.error }}
    steps:
      - id: identity
        name: Revalidate candidate pull request identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ needs.resolve.outputs.pull_request_number }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail

          error=''
          fail() {
            error="$1"
            echo "error=$error" >> "$GITHUB_OUTPUT"
            echo "::error::$error"
            exit 1
          }

          pull_request="$(gh api "repos/$REPOSITORY/pulls/$PULL_REQUEST_NUMBER")" ||
            fail 'Unable to revalidate the candidate pull request identity.'
          jq --exit-status \
            --arg repository "$REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            '.state == "open" and .merged_at == null and .base.ref == "master" and
             (.head.ref | startswith("release/") or startswith("hotfix/")) and
             .head.repo.full_name == $repository and .head.sha == $source_sha' \
            <<<"$pull_request" >/dev/null ||
            fail 'The candidate pull request identity changed before package verification.'

      - name: Check out trusted candidate verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: verifier
          sparse-checkout: scripts/verify-candidate-checks.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - id: checks
        name: Verify canonical CI checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ needs.resolve.outputs.pull_request_number }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          TRUSTED_REF: ${{ github.sha }}
        run: bash verifier/scripts/verify-candidate-checks.sh

  package-windows:
    needs:
      - resolve
      - package-gate
    if: needs.package-gate.result == 'success'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-major: [22, 24]
    permissions:
      contents: read
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-major }}.x
          cache: npm

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Windows native boundary
        shell: pwsh
        run: |
          npm ci
          npm run build:native
          npm run build
          if (-not (Test-Path 'build/Release/windows_trust.node') -or -not (Test-Path 'build/Release/windows_trust_test.node')) {
            throw 'The production and test-only Windows native trust boundaries were not built.'
          }
          if (-not (Test-Path 'dist/server.js')) {
            throw 'The runtime build did not produce dist/server.js.'
          }

      - id: metadata
        name: Verify release metadata
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ needs.resolve.outputs.candidate_version }}
        run: |
          $versions = node -e "const fs = require('node:fs'); const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8')); const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')); console.log(manifest.version); console.log(lock.version); console.log(lock.packages[''].version);"
          if ($LASTEXITCODE -ne 0 -or $versions.Count -ne 3) {
            throw 'Unable to read package metadata.'
          }
          $manifestVersion, $lockVersion, $rootPackageVersion = $versions
          if ($manifestVersion -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' -or $manifestVersion -ne $lockVersion -or $manifestVersion -ne $rootPackageVersion) {
            throw 'package.json and package-lock.json must match the stable branch version.'
          }
          if ($env:CANDIDATE_VERSION -notmatch "^$([regex]::Escape($manifestVersion))-(rc|hotfix)\.\d+\.[0-9a-f]{12}$") {
            throw 'The candidate version does not match the stable package version.'
          }

      - id: pack
        name: Pack Windows runtime candidate
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ needs.resolve.outputs.candidate_version }}
          NODE_MAJOR: ${{ matrix.node-major }}
        run: |
          npm version $env:CANDIDATE_VERSION --no-git-tag-version --ignore-scripts
          $pack = npm pack --json | ConvertFrom-Json
          $result = $pack[0]
          $allowed = @(
            'CHANGELOG.md',
            'README.md',
            'package.json',
            'build/Release/windows_trust.node',
            'build/Release/ssh-mcp-approver.exe',
            'scripts/windows-approver.mjs',
            'scripts/windows-audit-journal.mjs'
          )
          $unexpected = @($result.files.path | Where-Object {
            $_ -notin $allowed -and
            -not $_.StartsWith('dist/') -and
            -not $_.StartsWith('docs/') -and
            -not $_.StartsWith('skills/') -and
            -not $_.StartsWith('scripts/windows/')
          })
          if (-not $result.filename -or
              -not ($result.files.path -contains 'dist/server.js') -or
              -not ($result.files.path -contains 'build/Release/windows_trust.node') -or
              -not ($result.files.path -contains 'build/Release/ssh-mcp-approver.exe') -or
              -not ($result.files.path -contains 'scripts/windows-approver.mjs') -or
              -not ($result.files.path -contains 'scripts/windows-audit-journal.mjs') -or
              ($result.files.path -contains 'build/Release/posix_peer_credentials.node') -or
              ($result.files.path -contains 'build/Release/windows_trust_test.node') -or
              $unexpected.Count -ne 0) {
            throw 'npm pack did not produce the expected runtime-only package.'
          }
          $asset = "ssh-mcp-server-$($env:CANDIDATE_VERSION)-win32-x64-node$($env:NODE_MAJOR).tgz"
          Move-Item -LiteralPath $result.filename -Destination $asset
          "asset_name=$asset" | Add-Content $env:GITHUB_OUTPUT

      - name: Upload candidate package
        uses: actions/upload-artifact@v4
        with:
          name: candidate-node${{ matrix.node-major }}
          path: ${{ steps.pack.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - resolve
      - package-gate
      - package-windows
    if: needs.package-gate.result == 'success' && needs.package-windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
      actions: read
      pull-requests: read
    outputs:
      blockers: ${{ steps.checks.outputs.blockers }}
      error: ${{ steps.release.outputs.error || steps.checks.outputs.error }}
      release_url: ${{ steps.release.outputs.release_url }}
    steps:
      - name: Check out trusted candidate verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: verifier
          sparse-checkout: scripts/verify-candidate-checks.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download candidate packages
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-node*
          path: candidate
          merge-multiple: true

      - id: checks
        name: Recheck canonical CI checks before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ needs.resolve.outputs.pull_request_number }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          TRUSTED_REF: ${{ github.sha }}
        run: bash verifier/scripts/verify-candidate-checks.sh

      - id: release
        name: Publish or verify candidate prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ needs.resolve.outputs.pull_request_number }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          VERSION: ${{ needs.resolve.outputs.candidate_version }}
        run: |
          set -euo pipefail

          error_written=false
          emit_error() {
            local error="$1"
            if [[ "$error_written" == true ]]; then
              return
            fi
            error_written=true
            echo "error=$error" >> "$GITHUB_OUTPUT"
            echo "::error::$error"
          }

          fail() {
            emit_error "$1"
            exit 1
          }

          unexpected_error() {
            local status="$?"
            emit_error "Candidate publication pre-publication validation failed unexpectedly (exit status $status)."
            return "$status"
          }
          trap unexpected_error ERR

          gh api "repos/$REPOSITORY/pulls/$PULL_REQUEST_NUMBER" | jq --exit-status \
            --arg repository "$REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            '.state == "open" and .merged_at == null and .base.ref == "master" and
             (.head.ref | startswith("release/") or startswith("hotfix/")) and
             .head.repo.full_name == $repository and .head.sha == $source_sha' >/dev/null || fail 'The pull request changed while the candidate was being generated.'

          expected=(
            "ssh-mcp-server-$VERSION-win32-x64-node22.tgz"
            "ssh-mcp-server-$VERSION-win32-x64-node24.tgz"
          )
          for asset in "${expected[@]}"; do
            [[ -f "candidate/$asset" ]] || fail "The validated candidate asset $asset is unavailable."
          done

          resolve_tag_commit_sha() {
            local ref_json="$1"
            local object_type
            local object_sha
            local tag_object

            object_type="$(jq --raw-output '.object.type // empty' <<<"$ref_json")"
            object_sha="$(jq --raw-output '.object.sha // empty' <<<"$ref_json")"
            if [[ "$object_type" == commit && "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              printf '%s' "$object_sha"
              return 0
            fi
            if [[ "$object_type" != tag || ! "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              return 1
            fi

            tag_object="$(gh api "repos/$REPOSITORY/git/tags/$object_sha")" || return 1
            if [[ "$(jq --raw-output '.object.type // empty' <<<"$tag_object")" != commit ]]; then
              return 1
            fi
            object_sha="$(jq --raw-output '.object.sha // empty' <<<"$tag_object")"
            [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]] || return 1
            printf '%s' "$object_sha"
          }

          tag="v$VERSION"
          tag_probe="$(gh api --include --silent "repos/$REPOSITORY/git/ref/tags/$tag" 2>&1 || true)"
          tag_status="$(sed -n '1s/^[^ ]* \([0-9][0-9][0-9]\).*/\1/p' <<<"$tag_probe")"
          tag_commit_sha=''
          if [[ "$tag_status" == 200 ]]; then
            tag_ref="$(gh api "repos/$REPOSITORY/git/ref/tags/$tag")" || fail "Unable to resolve existing tag $tag."
            tag_commit_sha="$(resolve_tag_commit_sha "$tag_ref")" || fail "Unable to resolve existing tag $tag to a commit."
            [[ "$tag_commit_sha" == "$SOURCE_SHA" ]] || fail "Existing tag $tag does not point to the immutable source SHA."
          elif [[ "$tag_status" != 404 ]]; then
            fail "Unable to determine whether tag $tag exists (HTTP status: ${tag_status:-unknown})."
          fi

          release_probe="$(gh api --include --silent "repos/$REPOSITORY/releases/tags/$tag" 2>&1 || true)"
          release_status="$(sed -n '1s/^[^ ]* \([0-9][0-9][0-9]\).*/\1/p' <<<"$release_probe")"
          if [[ "$release_status" == 404 ]]; then
            gh release create "$tag" --repo "$REPOSITORY" --target "$SOURCE_SHA" --title "Candidate $VERSION" --generate-notes --prerelease
          elif [[ "$release_status" == 200 ]]; then
            release="$(gh release view "$tag" --repo "$REPOSITORY" --json isPrerelease,targetCommitish,url)" || fail "Unable to read existing $tag Release."
            jq --exit-status --arg source_sha "$SOURCE_SHA" '.isPrerelease == true and .targetCommitish == $source_sha' <<<"$release" >/dev/null || fail "Existing $tag Release is not the expected prerelease."
          else
            fail "Unable to determine whether candidate release $tag exists (HTTP status: ${release_status:-unknown})."
          fi

          tag_probe="$(gh api --include --silent "repos/$REPOSITORY/git/ref/tags/$tag" 2>&1 || true)"
          tag_status="$(sed -n '1s/^[^ ]* \([0-9][0-9][0-9]\).*/\1/p' <<<"$tag_probe")"
          [[ "$tag_status" == 200 ]] || fail "Candidate tag $tag is unavailable after release handling (HTTP status: ${tag_status:-unknown})."
          tag_ref="$(gh api "repos/$REPOSITORY/git/ref/tags/$tag")" || fail "Unable to resolve candidate tag $tag after release handling."
          tag_commit_sha="$(resolve_tag_commit_sha "$tag_ref")" || fail "Unable to resolve candidate tag $tag to a commit after release handling."
          [[ "$tag_commit_sha" == "$SOURCE_SHA" ]] || fail "Candidate tag $tag does not point to the immutable source SHA after release handling."

          assets="$(gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets')"
          for asset in "${expected[@]}"; do
            local_digest="$(sha256sum "candidate/$asset" | awk '{print $1}')"
            existing_digest="$(jq --raw-output --arg asset "$asset" '[.[] | select(.name == $asset) | .digest // empty] | first // empty' <<<"$assets")"
            if ! jq --exit-status --arg asset "$asset" '.[] | select(.name == $asset)' <<<"$assets" >/dev/null; then
              gh release upload "$tag" "candidate/$asset" --repo "$REPOSITORY"
            elif [[ "$existing_digest" != "sha256:$local_digest" ]]; then
              fail "Existing release asset $asset has a digest different from the validated candidate."
            fi
          done

          assets="$(gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets')"
          for asset in "${expected[@]}"; do
            local_digest="$(sha256sum "candidate/$asset" | awk '{print $1}')"
            final_digest="$(jq --raw-output --arg asset "$asset" '[.[] | select(.name == $asset) | .digest // empty] | first // empty' <<<"$assets")"
            [[ "$final_digest" == "sha256:$local_digest" ]] || fail "Published release asset $asset does not match the validated candidate digest."
          done

          echo "release_url=$(gh release view "$tag" --repo "$REPOSITORY" --json url --jq '.url')" >> "$GITHUB_OUTPUT"

  report:
    needs:
      - resolve
      - check
      - package-gate
      - package-windows
      - publish
    if: always() && needs.resolve.result != 'skipped' && needs.resolve.outputs.reportable == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Complete check and report candidate outcome
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ needs.resolve.outputs.candidate_version }}
          CHECK_ID: ${{ needs.check.outputs.id }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_GATE_BLOCKERS: ${{ needs.package-gate.outputs.blockers }}
          PACKAGE_GATE_ERROR: ${{ needs.package-gate.outputs.error }}
          PACKAGE_GATE_RESULT: ${{ needs.package-gate.result }}
          PUBLISH_BLOCKERS: ${{ needs.publish.outputs.blockers }}
          PUBLISH_ERROR: ${{ needs.publish.outputs.error }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PULL_REQUEST_NUMBER: ${{ needs.resolve.outputs.pull_request_number }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_ACCEPTED: ${{ needs.resolve.outputs.accepted }}
          REQUEST_ERROR: ${{ needs.resolve.outputs.error }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          PACKAGING_RESULT: ${{ needs.package-windows.result }}
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          set -euo pipefail

          status=failure
          title='Package candidate was not started'
          reason="$REQUEST_ERROR"
          if [[ "$REQUEST_ACCEPTED" == true ]]; then
            if [[ "$PACKAGE_GATE_RESULT" == success && "$PACKAGING_RESULT" == success && "$PUBLISH_RESULT" == success ]]; then
              status=success
              title="Package candidate $CANDIDATE_VERSION generated"
              reason=''
            elif [[ "$PACKAGE_GATE_RESULT" != success ]]; then
              title='Package candidate gate blocked'
              reason="${PACKAGE_GATE_BLOCKERS:-${PACKAGE_GATE_ERROR:-The required source checks did not pass.}}"
            elif [[ "$PACKAGING_RESULT" != success ]]; then
              title='Package candidate packaging failed'
              reason='The Windows Node.js 22 and 24 candidate packages did not pass build or package inspection.'
            elif [[ -n "$PUBLISH_BLOCKERS" || -n "$PUBLISH_ERROR" ]]; then
              title='Package candidate publication gate blocked'
              reason="${PUBLISH_BLOCKERS:-$PUBLISH_ERROR}"
            else
              title='Package candidate publication failed'
              reason='The validated candidate could not be published to its prerelease.'
            fi
          fi

          run_url="$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          check_report_failed=false
          if [[ "$CHECK_RESULT" != success || -z "$CHECK_ID" ]]; then
            echo "::error::Unable to create the candidate check. Verify checks: write access for GITHUB_TOKEN and rerun /generate-candidate. The marked PR comment will still be attempted."
            status=failure
            title='Package candidate check reporting failed'
            reason='The candidate result could not be recorded in the GitHub check. Verify checks: write access for GITHUB_TOKEN and rerun /generate-candidate.'
            check_report_failed=true
          else
            if ! gh api --method PATCH "repos/$REPOSITORY/check-runs/$CHECK_ID" \
                --raw-field status=completed \
                --raw-field conclusion="$status" \
                --raw-field details_url="$run_url" \
                --raw-field "output[title]=$title" \
                --raw-field "output[summary]=${reason:-Immutable candidate $CANDIDATE_VERSION was generated for $SOURCE_SHA.}" >/dev/null; then
              echo "::error::Unable to complete the candidate check. Verify checks: write access for GITHUB_TOKEN and rerun /generate-candidate. The marked PR comment will still be attempted."
              status=failure
              title='Package candidate check reporting failed'
              reason='The candidate result could not be recorded in the GitHub check. Verify checks: write access for GITHUB_TOKEN and rerun /generate-candidate.'
              check_report_failed=true
            fi
          fi

          marker="<!-- ssh-mcp-server:candidate:$REPOSITORY:$PULL_REQUEST_NUMBER -->"
          if [[ "$status" == success ]]; then
            body="$(printf '%s\n\n## Package candidate generated\n\nVersion: `%s`\n\nAssets: Windows x64 packages for Node.js 22 and Node.js 24 are attached to the [candidate prerelease](%s).\n\nCommit: `%s`\n\nRun: %s' "$marker" "$CANDIDATE_VERSION" "${{ needs.publish.outputs.release_url }}" "$SOURCE_SHA" "$run_url")"
          else
            body="$(printf '%s\n\n## Package candidate unavailable\n\nReason: %s\n\nRun: %s\n\nVerify the release branch and retry `/generate-candidate`.' "$marker" "$reason" "$run_url")"
          fi
          comment_publication_failed=false
          if ! comments="$(gh api "repos/$REPOSITORY/issues/$PULL_REQUEST_NUMBER/comments" --paginate)"; then
            echo "::error::Unable to read the existing candidate PR comment. Grant the report job pull-requests: write and rerun /generate-candidate."
            comment_publication_failed=true
          else
            comment_id="$(jq --raw-output --arg marker "$marker" '[.[] | select((.user.login == "github-actions[bot]" or .user.id == 41898282) and (.body | startswith($marker)))] | first | .id // empty' <<<"$comments")"
            if [[ -n "$comment_id" ]]; then
              if ! gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --raw-field body="$body" >/dev/null; then
                echo "::error::Unable to update the existing candidate PR comment. Verify pull-requests: write access for GITHUB_TOKEN and rerun /generate-candidate."
                comment_publication_failed=true
              fi
            else
              if ! gh api --method POST "repos/$REPOSITORY/issues/$PULL_REQUEST_NUMBER/comments" --raw-field body="$body" >/dev/null; then
                echo "::error::Unable to create the candidate PR comment. Verify pull-requests: write access for GITHUB_TOKEN and rerun /generate-candidate."
                comment_publication_failed=true
              fi
            fi
          fi
          if [[ "$check_report_failed" == true || "$comment_publication_failed" == true ]]; then
            echo "::error::Candidate reporting failed; the workflow result is failure and success was not reported as complete."
            exit 1
          fi
